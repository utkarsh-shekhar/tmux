# source using the below command and then in tmux: prefix + I to fetch the plugin and source it.
# tmux source ~/.tmux.conf
# OR
# tmux source ~/.config/tmux/tmux.conf

# This repo keeps its plugins next to the config instead of the default
# ~/.tmux/plugins, so tell TPM where to look. It reads this when it runs below.
set-environment -g TMUX_PLUGIN_MANAGER_PATH '/home/ubuntu/.config/tmux/plugins'

# List of plugins
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

set-option -g renumber-windows on

# vim bindings
setw -g mode-keys vi
set -g status-keys vi
set -g mode-keys vi

# set mouse support on
set -g mouse on

# Toggle synchronize-panes fo all panes in a window
bind S setw synchronize-panes

TMUX_FZF_ORDER="pane|window|session|command|keybinding|clipboard|process"
TMUX_FZF_PANE_FORMAT="[#{window_name}] #{pane_current_command}  [#{pane_width}x#{pane_height}] [history #{history_size}/#{history_limit}, #{history_bytes} bytes] #{?pane_active,[active],[inactive]}"

# ─── Catppuccin theme ────────────────────────────────────────────────────────
# Flavour: mocha (dark), macchiato, frappe or latte (light).
set -g @catppuccin_flavour 'mocha'

# Rounded window "pills" instead of the flat/basic window tabs.
set -g @catppuccin_window_status_style 'rounded'

# Nerd Font icons for window flags (zoom / activity / bell / last / ...).
set -g @catppuccin_window_flags 'icon'

# Window labels: show the window name in every state.
set -g @catppuccin_window_text ' #W'
set -g @catppuccin_window_current_text ' #W'

# Status line composition. Catppuccin ships ready-made colour modules that are
# plugged in via #{E:@catppuccin_status_<module>}.
set -g status-left-length 100
set -g status-right-length 100

# Left: session (turns red while the prefix is pressed) + running command.
set -g status-left "#{E:@catppuccin_status_session}"
set -ag status-left "#{E:@catppuccin_status_application}"

# Right: working directory, user and date/time.
set -g status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_user}"
set -ag status-right "#{E:@catppuccin_status_date_time}"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
